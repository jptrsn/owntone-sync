name: Deploy site to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-tiny-lazy
    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pages branch and deploy
        run: |
          git config user.name "Forgejo Actions"
          git config user.email "actions@codeberg.org"
          git checkout pages || git switch --orphan pages
          git rm -rf . 2>/dev/null || true
          git checkout main -- site/
          shopt -s dotglob nullglob
          mv site/* . 2>/dev/null || true
          rmdir site 2>/dev/null || true
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy from main @ ${GITHUB_SHA:0:8}"
            git push origin pages
          fi